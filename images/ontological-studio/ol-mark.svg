<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 50 920 620">
  <title>Ontologic</title>
  <!--
    OL mark: the letters O and L, linked. The L's stem goes through the O; above the
    O's centre the ring passes over the stem, below it the L passes over the ring.
    Gaps are cut with masks (real transparency), so the mark sits on any background and
    can be drawn in one colour (the tray icon is).

    O: centre (330,360), centre-line r 230, width 130 (inner radius 165).
    L: as tall as the O (65..655): stem x 400 from y 130, corner r 150, foot at y 590,
       width 130. The stem's top runs under the ring; the foot ends in a 45° cut
       (top edge to x 925, bottom edge to x 795).
    Gap 30 each side (mask strokes 130 + 2×30). The stem's right edge (465) is exactly the
    O's inner radius minus the gap, so the cuts meet the split line (y 360) tangentially.
    Colours follow the app: violet O, teal L.
  -->
  <defs>
    <clipPath id="bm-top"><rect x="20" y="50" width="920" height="310"/></clipPath>
    <clipPath id="bm-bottom"><rect x="20" y="360" width="920" height="310"/></clipPath>
    <clipPath id="bm-l-end"><path d="M20 50H1400L780 670H20Z"/></clipPath>
    <mask id="bm-l-under-o" maskUnits="userSpaceOnUse" x="20" y="50" width="920" height="620">
      <rect x="20" y="50" width="920" height="620" fill="#fff"/>
      <circle cx="330" cy="360" r="230" fill="none" stroke="#000" stroke-width="190" clip-path="url(#bm-top)"/>
    </mask>
    <mask id="bm-o-under-l" maskUnits="userSpaceOnUse" x="20" y="50" width="920" height="620">
      <rect x="20" y="50" width="920" height="620" fill="#fff"/>
      <path d="M400 130V440A150 150 0 0 0 550 590H925" fill="none" stroke="#000" stroke-width="190" stroke-linejoin="round" clip-path="url(#bm-bottom)"/>
    </mask>
  </defs>
  <circle class="bm-o" cx="330" cy="360" r="230" fill="none" stroke="#7c6ff2" stroke-width="130" mask="url(#bm-o-under-l)"/>
  <g clip-path="url(#bm-l-end)">
    <path class="bm-t" d="M400 130V440A150 150 0 0 0 550 590H925" fill="none" stroke="#19b8a1" stroke-width="130" stroke-linejoin="round" mask="url(#bm-l-under-o)"/>
  </g>
</svg>
