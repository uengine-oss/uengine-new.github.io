<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" width="960" height="750" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="16" role="img" aria-label="문서 표현과 지식 그래프 표현: 제15조 위반의 벌칙을 찾으려면 조문 네 개를 건너야 한다">
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="dg-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="750" fill="#ffffff"/>

  <!-- 위: 문서 표현 -->
  <text x="20" y="32" font-size="18" font-weight="700" fill="#111827">문서 표현 — 조문을 청크로 자른 글</text>
  <g fill="#f9fafb" stroke="#9ca3af" stroke-width="1.4">
    <rect x="20" y="48" width="296" height="170" rx="10"/>
    <rect x="332" y="48" width="296" height="170" rx="10"/>
    <rect x="644" y="48" width="296" height="170" rx="10"/>
  </g>
  <g font-weight="700" fill="#1d4ed8">
    <text x="36" y="76">법 제15조 ②</text>
    <text x="348" y="76">법 제36조 (벌칙)</text>
    <text x="660" y="76">법 제39조 (과태료)</text>
  </g>
  <g fill="#374151">
    <text x="36" y="104">…해임하거나 퇴직한 날부터</text>
    <text x="36" y="126">30일 이내에 다시 안전관리자를</text>
    <text x="36" y="148">선임하여야 한다.</text>

    <text x="348" y="104">다음 각 호의 어느 하나에 해당하는</text>
    <text x="348" y="126">자는 1천500만원 이하의 벌금에</text>
    <text x="348" y="148">처한다. …</text>
    <text x="348" y="170">6. <tspan fill="#c2410c" font-weight="700">제15조제1항 또는 제2항</tspan>의</text>
    <text x="348" y="192">규정을 위반하여 안전관리자를 …</text>

    <text x="660" y="104">① … 500만원 이하의 과태료를</text>
    <text x="660" y="126">부과한다.</text>
    <text x="660" y="148">5. … <tspan fill="#c2410c" font-weight="700">제15조제3항</tspan>의 규정에 따른</text>
    <text x="660" y="170">안전관리자의 선임신고를 기간</text>
    <text x="660" y="192">이내에 하지 아니하거나 …</text>
  </g>
  <text x="20" y="246" fill="#4b5563">벌칙 조문은 대상 의무를 「제15조제1항」 같은 조 번호로만 가리키고, 형량은 각 호 위 머리글에 따로 있습니다.</text>

  <line x1="480" y1="262" x2="480" y2="302" stroke="#6b7280" stroke-width="2" marker-end="url(#dg-a)"/>
  <text x="494" y="288" fill="#4b5563">정보 추출 (6장 인제스천)</text>

  <!-- 아래: 지식 그래프 표현 -->
  <text x="20" y="330" font-size="18" font-weight="700" fill="#111827">지식 그래프 표현 — 관계를 따라 건너간다</text>

  <g stroke-width="1.6">
    <rect x="40" y="497" width="100" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="230" y="427" width="100" height="46" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="230" y="567" width="100" height="46" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="430" y="427" width="140" height="46" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
    <rect x="430" y="567" width="140" height="46" rx="10" fill="#ccfbf1" stroke="#0d9488"/>
    <rect x="665" y="427" width="110" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="665" y="567" width="110" height="46" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="615" y="339" width="210" height="46" rx="10" fill="#ecfccb" stroke="#65a30d"/>
    <rect x="615" y="655" width="210" height="46" rx="10" fill="#ecfccb" stroke="#65a30d"/>
  </g>
  <g font-weight="700" fill="#111827" text-anchor="middle">
    <text x="90" y="526">제15조</text>
    <text x="280" y="456">제15조②</text>
    <text x="280" y="596">제15조③</text>
    <text x="500" y="456">제36조 6호</text>
    <text x="500" y="596">제39조① 5호</text>
    <text x="720" y="456">제36조</text>
    <text x="720" y="596">제39조①</text>
    <text x="720" y="368">1천500만원 이하의 벌금</text>
    <text x="720" y="684">500만원 이하의 과태료</text>
  </g>

  <!-- 경로 A (강조) -->
  <g stroke="#ea580c" stroke-width="2.4" fill="none" marker-end="url(#dg-o)">
    <line x1="140" y1="510" x2="227" y2="458"/>
    <line x1="430" y1="450" x2="334" y2="450"/>
    <line x1="665" y1="450" x2="574" y2="450"/>
    <line x1="720" y1="427" x2="720" y2="388"/>
  </g>
  <!-- 경로 B -->
  <g stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#dg-a)">
    <line x1="140" y1="530" x2="227" y2="582"/>
    <line x1="430" y1="590" x2="334" y2="590"/>
    <line x1="665" y1="590" x2="574" y2="590"/>
    <line x1="720" y1="613" x2="720" y2="652"/>
  </g>
  <g fill="#4b5563" text-anchor="middle">
    <text x="190" y="526">HAS_PART</text>
    <text x="382" y="440" fill="#c2410c" font-weight="700">PENALIZES</text>
    <text x="619" y="440">HAS_PART</text>
    <text x="382" y="580">PENALIZES</text>
    <text x="619" y="580">HAS_PART</text>
  </g>
  <g fill="#4b5563">
    <text x="730" y="414">IMPOSES</text>
    <text x="730" y="640">IMPOSES</text>
  </g>
  <text x="20" y="736" fill="#111827">「제15조를 어기면?」 → <tspan fill="#c2410c" font-weight="700">제15조 → 제15조② ← 제36조 6호 ← 제36조 → 벌금</tspan> : 관계 네 개를 건너야 형량에 닿는다</text>
</svg>
