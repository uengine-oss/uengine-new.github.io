<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>

  <!-- Law -->
  <rect x="20" y="40" width="215" height="112" rx="12" fill="#fbe7ea" stroke="#c98a95" stroke-width="2"/>
  <text x="36" y="70" font-size="18" font-weight="700" fill="#8a3442">:Law</text>
  <text x="36" y="100" font-size="16" fill="#1f2937">name: '위험물안전관리법'</text>
  <text x="36" y="128" font-size="16" fill="#1f2937">kind: '법률'</text>

  <!-- Article 15 -->
  <rect x="375" y="40" width="225" height="112" rx="12" fill="#efe7fd" stroke="#9b85d6" stroke-width="2"/>
  <text x="391" y="70" font-size="18" font-weight="700" fill="#4c2f99">:Article</text>
  <text x="391" y="100" font-size="16" fill="#1f2937">no: '제15조'</text>
  <text x="391" y="128" font-size="16" fill="#1f2937">title: '위험물안전관리자'</text>

  <!-- Paragraph -->
  <rect x="755" y="40" width="190" height="140" rx="12" fill="#e3f2fc" stroke="#6aaedb" stroke-width="2"/>
  <text x="771" y="70" font-size="18" font-weight="700" fill="#1d5f8c">:Paragraph</text>
  <text x="771" y="100" font-size="16" fill="#1f2937">id: '제15조②'</text>
  <text x="771" y="128" font-size="16" fill="#1f2937">no: 2</text>
  <text x="771" y="156" font-size="16" fill="#1f2937">text: '…30일 이내…'</text>

  <!-- Article 36 / 39 -->
  <rect x="215" y="300" width="230" height="100" rx="12" fill="#efe7fd" stroke="#9b85d6" stroke-width="2"/>
  <text x="231" y="330" font-size="18" font-weight="700" fill="#4c2f99">:Article</text>
  <text x="231" y="358" font-size="16" fill="#1f2937">no: '제36조'</text>
  <text x="231" y="384" font-size="16" fill="#1f2937">title: '벌칙'</text>

  <rect x="545" y="300" width="230" height="100" rx="12" fill="#efe7fd" stroke="#9b85d6" stroke-width="2"/>
  <text x="561" y="330" font-size="18" font-weight="700" fill="#4c2f99">:Article</text>
  <text x="561" y="358" font-size="16" fill="#1f2937">no: '제39조'</text>
  <text x="561" y="384" font-size="16" fill="#1f2937">title: '과태료'</text>

  <!-- relationships -->
  <line x1="237" y1="96" x2="371" y2="96" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="304" y="86" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">HAS_ARTICLE</text>

  <line x1="602" y1="96" x2="751" y2="96" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="677" y="86" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">HAS_PARAGRAPH</text>

  <line x1="360" y1="298" x2="452" y2="156" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="392" y="222" font-size="16" text-anchor="end" fill="#374151" font-weight="600">REFERS_TO</text>
  <text x="392" y="244" font-size="16" text-anchor="end" fill="#374151">{at: '제6호'}</text>

  <line x1="630" y1="298" x2="538" y2="156" stroke="#4b5563" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="598" y="222" font-size="16" fill="#374151" font-weight="600">REFERS_TO</text>
  <text x="598" y="244" font-size="16" fill="#374151">{at: '제5호'}</text>

  <!-- legend -->
  <line x1="20" y1="432" x2="940" y2="432" stroke="#e5e7eb" stroke-width="2"/>
  <text x="20" y="466" font-size="17" font-weight="700" fill="#111827">노드</text>
  <text x="20" y="492" font-size="16" fill="#374151">레이블(:Article)로 종류를,</text>
  <text x="20" y="516" font-size="16" fill="#374151">속성(no, title)으로 값을 가집니다</text>

  <text x="340" y="466" font-size="17" font-weight="700" fill="#111827">관계</text>
  <text x="340" y="492" font-size="16" fill="#374151">타입(REFERS_TO)과 방향(→)이 있고</text>
  <text x="340" y="516" font-size="16" fill="#374151">관계에도 속성({at})을 둘 수 있습니다</text>

  <text x="660" y="466" font-size="17" font-weight="700" fill="#111827">Cypher 로 쓰면</text>
  <text x="660" y="492" font-size="16" fill="#374151" font-family="Menlo, Consolas, monospace">(p:Article {no:'제36조'})</text>
  <text x="660" y="516" font-size="16" fill="#374151" font-family="Menlo, Consolas, monospace">-[:REFERS_TO {at:'제6호'}]-></text>
  <text x="660" y="540" font-size="16" fill="#374151" font-family="Menlo, Consolas, monospace">(a:Article {no:'제15조'})</text>
</svg>
