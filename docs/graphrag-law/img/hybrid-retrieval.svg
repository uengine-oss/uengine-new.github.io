<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="16" role="img" aria-label="색인으로 진입 노드를 찾고 관계를 따라 넓히는 혼합 검색">
  <defs>
    <marker id="hr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="310" fill="#ffffff"/>

  <rect x="16" y="104" width="150" height="92" rx="12" fill="#1e3a5f"/>
  <text x="91" y="136" text-anchor="middle" font-weight="700" fill="#ffffff">질문</text>
  <text x="91" y="162" text-anchor="middle" fill="#ffffff">위험물안전관리자가</text>
  <text x="91" y="182" text-anchor="middle" fill="#ffffff">해임되거나 …</text>

  <rect x="206" y="40" width="226" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="222" y="68" font-weight="700" fill="#111827">전문 색인 · 낱말</text>
  <text x="222" y="94" fill="#374151">cjk 분석기, provision_text</text>
  <text x="222" y="120" fill="#1d4ed8">이 교재에서 씀</text>
  <rect x="206" y="160" width="226" height="100" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="222" y="188" font-weight="700" fill="#111827">벡터 색인 · 뜻</text>
  <text x="222" y="214" fill="#374151">임베딩 + 코사인 유사도</text>
  <text x="222" y="240" fill="#6b7280">이 교재는 안 만듦(11장 과제)</text>

  <rect x="472" y="70" width="200" height="160" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="488" y="98" font-weight="700" fill="#111827">진입 노드 (조문)</text>
  <g fill="#374151">
    <text x="488" y="126">법 제15조제2항</text>
    <text x="488" y="150">법 제15조제4항</text>
    <text x="488" y="174">법 제11조의2제4항</text>
    <text x="488" y="198">…</text>
  </g>

  <rect x="712" y="40" width="232" height="220" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="728" y="68" font-weight="700" fill="#111827">관계 따라 넓히기</text>
  <g fill="#374151">
    <text x="728" y="98">HAS_PART → 항 · 호</text>
    <text x="728" y="124">IMPLEMENTS ← 하위법령</text>
    <text x="728" y="150">PENALIZES ← 벌칙 호</text>
    <text x="728" y="176">IMPOSES → 형량</text>
  </g>
  <text x="728" y="216" font-weight="700" fill="#c2410c">→ 부분 그래프를</text>
  <text x="728" y="240" font-weight="700" fill="#c2410c">LLM 컨텍스트로</text>

  <g stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#hr-a)">
    <line x1="166" y1="138" x2="202" y2="100"/>
    <line x1="166" y1="164" x2="202" y2="204"/>
    <line x1="432" y1="100" x2="468" y2="128"/>
    <line x1="432" y1="204" x2="468" y2="176"/>
    <line x1="672" y1="150" x2="708" y2="150"/>
  </g>
  <text x="20" y="294" fill="#4b5563">색인은 그래프의 어디서 시작할지를, 관계는 어디까지 따라갈지를 정합니다.</text>
</svg>
