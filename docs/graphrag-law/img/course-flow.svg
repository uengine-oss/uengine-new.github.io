<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="16" role="img" aria-label="실습 흐름: 3장 Neo4j 띄우기부터 10장 벡터 RAG 비교까지">
  <defs>
    <marker id="cf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>

  <!-- 1행: 3~6장 -->
  <g stroke-width="1.5">
    <rect x="20" y="40" width="200" height="104" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="260" y="40" width="200" height="104" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
    <rect x="500" y="40" width="200" height="104" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="740" y="40" width="200" height="104" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  </g>
  <g font-weight="700" fill="#2563eb">
    <text x="36" y="68">3장 · 준비</text>
    <text x="276" y="68">4장 · 준비</text>
    <text x="516" y="68" fill="#6d28d9">5장 · 구축</text>
    <text x="756" y="68" fill="#6d28d9">6장 · 구축</text>
  </g>
  <g font-weight="700" font-size="19" fill="#111827">
    <text x="36" y="98">Neo4j 띄우기</text>
    <text x="276" y="98">Cypher 기초</text>
    <text x="516" y="98">스키마 설계</text>
    <text x="756" y="98">인제스천</text>
  </g>
  <g fill="#4b5563">
    <text x="36" y="126">Docker · APOC</text>
    <text x="276" y="126">MERGE · MATCH · 색인</text>
    <text x="516" y="126">골든 퀘스천 → 틀</text>
    <text x="756" y="126">PDF 9종 → 그래프</text>
  </g>

  <!-- 2행: 7~10장 -->
  <g stroke-width="1.5">
    <rect x="20" y="214" width="200" height="104" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="260" y="214" width="200" height="104" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="500" y="214" width="200" height="104" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="740" y="214" width="200" height="104" rx="12" fill="#fef3c7" stroke="#d97706"/>
  </g>
  <g font-weight="700">
    <text x="36" y="242" fill="#6d28d9">7장 · 구축</text>
    <text x="276" y="242" fill="#1d4ed8">8장 · 질의</text>
    <text x="516" y="242" fill="#1d4ed8">9장 · 질의</text>
    <text x="756" y="242" fill="#b45309">10장 · 비교</text>
  </g>
  <g font-weight="700" font-size="19" fill="#111827">
    <text x="36" y="272">중의성 해소</text>
    <text x="276" y="272">MCP 연결</text>
    <text x="516" y="272">골든 퀘스천 묻기</text>
    <text x="756" y="272">벡터 RAG 와 비교</text>
  </g>
  <g fill="#4b5563">
    <text x="36" y="300">이름 228가지 → 136</text>
    <text x="276" y="300">읽기 전용 도구 2개</text>
    <text x="516" y="300">근거 조문과 함께 답</text>
    <text x="756" y="300">같은 질문 · 재현율</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#6b7280" stroke-width="1.8" fill="none" marker-end="url(#cf-a)">
    <line x1="222" y1="92" x2="256" y2="92"/>
    <line x1="462" y1="92" x2="496" y2="92"/>
    <line x1="702" y1="92" x2="736" y2="92"/>
    <path d="M840 146 L840 178 L120 178 L120 210"/>
    <line x1="222" y1="266" x2="256" y2="266"/>
    <line x1="462" y1="266" x2="496" y2="266"/>
    <line x1="702" y1="266" x2="736" y2="266"/>
  </g>

  <!-- 범례 -->
  <g fill="#4b5563">
    <rect x="20" y="334" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="42" y="346">터미널에서 직접</text>
    <rect x="200" y="334" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="222" y="346">Claude Code 가 코드를 쓰고 사람이 검토</text>
    <rect x="540" y="334" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="562" y="346">Claude Code + Neo4j MCP</text>
    <rect x="770" y="334" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
    <text x="792" y="346">비교 실험</text>
  </g>
</svg>
