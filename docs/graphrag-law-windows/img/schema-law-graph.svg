<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#111827">이번 적재(6장): 구조층 · 참조층 · 용어층</text>
  <text x="940" y="28" font-size="16" text-anchor="end" fill="#6b7280">점선: 의미층(7장)</text>

  <!-- Law -->
  <rect x="20" y="80" width="140" height="70" rx="12" fill="#fbe7ea" stroke="#c98a95" stroke-width="2"/>
  <text x="90" y="110" font-size="18" font-weight="700" text-anchor="middle" fill="#8a3442">Law</text>
  <text x="90" y="134" font-size="16" text-anchor="middle" fill="#374151">법령 (lawId)</text>
  <path d="M55,80 C55,48 125,48 125,78" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text x="90" y="50" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">ENFORCES</text>

  <!-- Provision group -->
  <rect x="260" y="44" width="350" height="290" rx="14" fill="#f7f3ff" stroke="#9b85d6" stroke-width="2"/>
  <text x="276" y="70" font-size="17" font-weight="700" fill="#4c2f99">Provision (pid) — 조·항·호·목 공통</text>
  <rect x="280" y="92" width="140" height="50" rx="10" fill="#efe7fd" stroke="#9b85d6" stroke-width="1.6"/>
  <text x="350" y="123" font-size="16" text-anchor="middle" fill="#1f2937">Article 조</text>
  <rect x="450" y="92" width="140" height="50" rx="10" fill="#e3f2fc" stroke="#6aaedb" stroke-width="1.6"/>
  <text x="520" y="123" font-size="16" text-anchor="middle" fill="#1f2937">Paragraph 항</text>
  <rect x="280" y="196" width="140" height="50" rx="10" fill="#dcf5ea" stroke="#3fb68b" stroke-width="1.6"/>
  <text x="350" y="227" font-size="16" text-anchor="middle" fill="#1f2937">Item 호</text>
  <rect x="450" y="196" width="140" height="50" rx="10" fill="#dcf5ea" stroke="#3fb68b" stroke-width="1.6"/>
  <text x="520" y="227" font-size="16" text-anchor="middle" fill="#1f2937">SubItem 목</text>
  <line x1="421" y1="117" x2="447" y2="117" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="143" x2="408" y2="193" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <line x1="350" y1="143" x2="350" y2="193" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <line x1="421" y1="221" x2="447" y2="221" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text x="276" y="285" font-size="16" fill="#374151">단계 사이는 모두 HAS_PART</text>
  <text x="276" y="309" font-size="16" fill="#6b7280">항이 없는 조는 조 → 호로 바로</text>

  <!-- Law -> Article -->
  <line x1="162" y1="117" x2="277" y2="117" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="218" y="107" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">HAS_ARTICLE</text>
  <!-- CITES_LAW -->
  <line x1="258" y1="262" x2="110" y2="153" stroke="#4b5563" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="238" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">CITES_LAW</text>

  <!-- reference loop -->
  <path d="M300,335 L300,378 L420,378 L420,337" fill="none" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="440" y="366" font-size="16" fill="#111827" font-weight="700">REFERS_TO · IMPLEMENTS · PENALIZES</text>
  <text x="440" y="390" font-size="16" fill="#374151">참조층: 조문 → 조문 (인용 · 위임 · 벌칙)</text>

  <!-- right column -->
  <rect x="750" y="44" width="190" height="74" rx="12" fill="#eef1e4" stroke="#8f9a6a" stroke-width="2"/>
  <text x="845" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="#4d5530">Sanction</text>
  <text x="845" y="100" font-size="16" text-anchor="middle" fill="#374151">제재 · 형량 상한</text>
  <rect x="750" y="150" width="190" height="74" rx="12" fill="#e0f7f8" stroke="#3db4bd" stroke-width="2"/>
  <text x="845" y="180" font-size="18" font-weight="700" text-anchor="middle" fill="#1f6d73">Annex</text>
  <text x="845" y="206" font-size="16" text-anchor="middle" fill="#374151">별표·서식 (본문 없음)</text>
  <rect x="750" y="256" width="190" height="86" rx="12" fill="#fdf0dc" stroke="#e0a03c" stroke-width="2"/>
  <text x="845" y="286" font-size="18" font-weight="700" text-anchor="middle" fill="#8a5a12">Term</text>
  <text x="845" y="310" font-size="16" text-anchor="middle" fill="#374151">용어 · 별칭</text>
  <text x="845" y="332" font-size="16" text-anchor="middle" fill="#6b7280">aliases · normKeys</text>

  <line x1="612" y1="81" x2="747" y2="81" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="680" y="71" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">IMPOSES</text>
  <line x1="612" y1="187" x2="747" y2="187" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="680" y="177" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">USES_ANNEX</text>
  <line x1="612" y1="280" x2="747" y2="280" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="680" y="270" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">MENTIONS</text>
  <line x1="748" y1="318" x2="614" y2="318" stroke="#4b5563" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="680" y="340" font-size="16" text-anchor="middle" fill="#374151" font-weight="600">DEFINED_IN</text>

  <!-- semantic layer -->
  <rect x="20" y="452" width="920" height="168" rx="14" fill="#fbfaff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="36" y="478" font-size="17" font-weight="700" fill="#5b21b6">의미층 — LLM 으로 조문에서 추출 (7장)</text>
  <rect x="60" y="530" width="170" height="64" rx="12" fill="#f5f0ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="145" y="558" font-size="18" font-weight="700" text-anchor="middle" fill="#5b21b6">Norm</text>
  <text x="145" y="582" font-size="16" text-anchor="middle" fill="#374151">의무 · 금지 · 권한</text>
  <rect x="520" y="530" width="170" height="64" rx="12" fill="#f5f0ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="605" y="558" font-size="18" font-weight="700" text-anchor="middle" fill="#5b21b6">Actor</text>
  <text x="605" y="582" font-size="16" text-anchor="middle" fill="#374151">주체 · 기관</text>
  <line x1="232" y1="562" x2="517" y2="562" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="375" y="552" font-size="16" text-anchor="middle" fill="#5b21b6" font-weight="600">HAS_SUBJECT · ADDRESSED_TO</text>
  <line x1="160" y1="528" x2="282" y2="337" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="226" y="420" font-size="16" fill="#5b21b6" font-weight="600">BASED_ON</text>
  <line x1="692" y1="560" x2="830" y2="345" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="806" y="430" font-size="16" fill="#5b21b6" font-weight="600">DEFINED_BY</text>
</svg>
