<style>
/* ============================================================
   AI-Native Enterprise Stack — 전시 상영용 키오스크
   메인 스플래시(index.html)의 4계층 스택 애니메이션과
   기존 홈페이지의 폰트·색·데모 캡처 자산만으로 구성한다.
   ============================================================ */
:root{
  --font-global:'Pretendard','Pretendard Variable','DM Sans',sans-serif;
  --c-primary-1:#4567ed; --c-primary-2:#7752e7; --c-primary-3:#b947d9; --c-primary-4:#e748b1;
  --gradient-primary-1:linear-gradient(90deg,var(--c-primary-4) 0%,var(--c-primary-3) 33%,var(--c-primary-2) 67%,var(--c-primary-1) 100%);
  --l1:#7fc3a8; --l2:#9ec1de; --l3:#e7c375; --l4:#aab2c8;
}
*{box-sizing:border-box;}
h1,h2,h3,p,.rail-tx,.chip span,.lg span{word-break:keep-all;overflow-wrap:break-word;}
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
  font-family:var(--font-global);-webkit-font-smoothing:antialiased;}
#kiosk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
#stage{
  position:relative;width:1920px;height:1080px;flex:0 0 auto;
  transform-origin:center center;color:#fff;background:#0a0a0c;overflow:hidden;
}
/* 스플래시와 같은 보라·블루 라디얼 글로우 */
#stage .bgfx{position:absolute;inset:0;
  background:radial-gradient(60% 80% at 78% 44%, rgba(69,103,237,.20) 0%, rgba(183,71,217,.10) 45%, rgba(10,10,12,0) 75%);
  z-index:0;transition:opacity 1s ease;}
#stage .grain{position:absolute;inset:0;z-index:0;opacity:.5;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 120%, rgba(255,255,255,.05) 0%, rgba(0,0,0,0) 60%);}

/* ---------- 4계층 스택 (스플래시 자산 재사용) ---------- */
.stackwrap{position:absolute;top:0;left:0;width:520px;z-index:3;pointer-events:none;
  transform-origin:top left;
  transition:transform 1.15s cubic-bezier(.55,.06,.2,1), opacity .8s ease;}
.stackwrap.m-hero{transform:translate(646px,252px) scale(.86);}
.stackwrap.m-off{transform:translate(646px,252px) scale(.86);opacity:0;}
.stackwrap.m-left{transform:translate(150px,150px) scale(.86);}
.stackwrap.m-rail{transform:translate(56px,268px) scale(.325);}
.vision-stack{width:100%;}
.vision-stack .ls-stack{display:block;width:100%;height:auto;}
.vision-stack .ls-stack text{font-family:'Pretendard','Pretendard Variable',sans-serif;white-space:pre;}
.vision-stack.ls-armed .ls-layer{opacity:0;transform:translate(0px,-70px);
  transition:opacity .55s ease, transform .85s cubic-bezier(.2,.9,.25,1), filter .7s ease;}
.vision-stack.ls-armed .ls-layer.is-in{opacity:1;transform:translate(0,0);}
.vision-stack.ls-armed .ls-layer-body{opacity:0;transition:opacity .5s ease .2s;}
.vision-stack.ls-armed .ls-layer.is-in .ls-layer-body{opacity:1;}
.vision-stack.ls-armed .ls-posts path{stroke-dasharray:1px 1px;stroke-dashoffset:var(--ls-draw,-1px);
  transition:stroke-dashoffset .95s ease-out;}
.vision-stack.ls-armed .ls-node{opacity:0;transform:translate(0px,-18px);
  transition:opacity .4s ease .3s, transform .5s ease .3s;}
.vision-stack.ls-armed .ls-node.is-in{opacity:1;transform:translate(0,0);}
.vision-stack .ls-flow{opacity:0;transition:opacity .5s ease;}
.vision-stack .ls-flow.is-in{opacity:1;}
.vision-stack .ls-token{offset-rotate:0deg;animation-name:ls-token-move;animation-timing-function:linear;
  animation-iteration-count:infinite;animation-play-state:paused;}
.vision-stack .ls-flow.is-in .ls-token{animation-play-state:running;}
@keyframes ls-token-move{0%{offset-distance:0%;opacity:0;}14%{opacity:1;}86%{opacity:1;}100%{offset-distance:100%;opacity:0;}}
/* 현재 다루는 계층만 살리고 나머지는 눌러 둔다 */
.stackwrap[data-focus] #vision-stack.ls-armed .ls-layer.is-in{opacity:.12;}
.stackwrap[data-focus] #vision-stack .ls-flow.is-in{opacity:.18;}
.stackwrap[data-focus="1"] #vision-stack.ls-armed .ls-layer.is-in[data-ls-layer="1"],
.stackwrap[data-focus="2"] #vision-stack.ls-armed .ls-layer.is-in[data-ls-layer="2"],
.stackwrap[data-focus="3"] #vision-stack.ls-armed .ls-layer.is-in[data-ls-layer="3"],
.stackwrap[data-focus="4"] #vision-stack.ls-armed .ls-layer.is-in[data-ls-layer="4"]{
  opacity:1;filter:drop-shadow(0 0 26px rgba(255,255,255,.30));}

/* ---------- 좌측 진행 레일 ---------- */
.rail{position:absolute;left:56px;top:632px;width:200px;z-index:4;
  transition:opacity .7s ease;}
.rail-title{font-size:11px;letter-spacing:.20em;text-transform:uppercase;
  color:rgba(255,255,255,.38);margin-bottom:14px;}
.rail-item{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-top:1px solid rgba(255,255,255,.07);}
.rail-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);flex:0 0 8px;
  transition:background .5s ease, box-shadow .5s ease, transform .5s ease;}
.rail-item[data-layer="1"] .rail-dot.on{background:var(--l1);box-shadow:0 0 0 5px rgba(127,195,168,.16);}
.rail-item[data-layer="2"] .rail-dot.on{background:var(--l2);box-shadow:0 0 0 5px rgba(158,193,222,.16);}
.rail-item[data-layer="3"] .rail-dot.on{background:var(--l3);box-shadow:0 0 0 5px rgba(231,195,117,.16);}
.rail-item[data-layer="4"] .rail-dot.on{background:var(--l4);box-shadow:0 0 0 5px rgba(170,178,200,.16);}
.rail-dot.on{transform:scale(1.15);}
.rail-tx{font-size:13px;line-height:1.35;color:rgba(255,255,255,.34);transition:color .5s ease;}
.rail-tx b{display:block;font-weight:500;font-size:14px;}
.rail-item.on .rail-tx{color:rgba(255,255,255,.92);}

/* ---------- 상단/하단 HUD ---------- */
html.embed .hud-top,html.embed .hud-bot{display:none!important}
html.embed{cursor:default}
.hud-top{position:absolute;left:56px;right:56px;top:44px;z-index:6;transition:opacity .6s ease;
  display:flex;align-items:center;justify-content:space-between;}
.hud-brand{display:flex;align-items:center;gap:16px;pointer-events:auto;text-decoration:none;}
.hud-brand img{height:26px;width:auto;opacity:.92;}
.hud-brand span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);}
.hud-chapter{font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  background:var(--gradient-primary-1);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;transition:opacity .5s ease;}
.hud-bot{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:0 56px 30px;}
.bar{position:relative;height:3px;background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden;}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gradient-primary-1);border-radius:3px;}
.bar u{position:absolute;top:-3px;width:1px;height:9px;background:rgba(255,255,255,.28);}
.hud-meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  font-size:12px;letter-spacing:.10em;color:rgba(255,255,255,.34);}
.hud-hint{transition:opacity .6s ease;}
.hud-hint kbd{display:inline-block;padding:1px 6px;margin:0 2px;border-radius:4px;
  border:1px solid rgba(255,255,255,.18);font-family:var(--font-global);font-size:11px;}

/* ---------- 씬 공통 ---------- */
.scene-host{position:absolute;inset:0;z-index:2;}
.sc{position:absolute;inset:0;opacity:0;transition:opacity .75s ease;}
.sc.on{opacity:1;}
.sc-in{opacity:0;transform:translateY(26px);animation:scIn .95s cubic-bezier(.2,.85,.25,1) forwards;}
@keyframes scIn{to{opacity:1;transform:translateY(0);}}

/* ---------- 데모 화면 씬 ---------- */
.shot .txt{position:absolute;left:300px;top:210px;width:436px;}
.badge{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:100px;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);
  font-size:19px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.95);}
.badge em{font-style:normal;font-size:14px;font-weight:500;letter-spacing:.04em;
  color:rgba(255,255,255,.55);padding-right:11px;margin-right:1px;
  border-right:1px solid rgba(255,255,255,.22);white-space:nowrap;}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--l2);display:inline-block;}
.badge[data-layer="1"] i{background:var(--l1);} .badge[data-layer="3"] i{background:var(--l3);}
.badge[data-layer="4"] i{background:var(--l4);}
.shot .step{margin-top:26px;font-size:13px;letter-spacing:.22em;color:rgba(255,255,255,.34);}
.shot h3{margin:12px 0 0;font-size:40px;line-height:1.24;font-weight:500;letter-spacing:-.01em;}
.shot p{margin:20px 0 0;font-size:20px;line-height:1.62;color:rgba(255,255,255,.62);}
.shot .live{position:absolute;left:300px;bottom:150px;font-size:12px;letter-spacing:.18em;
  color:rgba(255,255,255,.30);}
.frame{position:absolute;left:796px;top:150px;width:1050px;height:790px;
  border-radius:16px;border:1px solid rgba(255,255,255,.13);background:#0e1116;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;}
.frame .bar-mac{position:absolute;left:0;right:0;top:0;height:34px;z-index:2;
  background:rgba(255,255,255,.045);border-bottom:1px solid rgba(255,255,255,.07);}
.frame .bar-mac s{position:absolute;top:13px;width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.20);}
.frame .bar-mac s:nth-child(1){left:16px;} .frame .bar-mac s:nth-child(2){left:32px;}
.frame .bar-mac s:nth-child(3){left:48px;}
.frame .pane{position:absolute;left:0;right:0;top:34px;bottom:0;overflow:hidden;}
.frame img,.frame video{width:100%;height:100%;object-fit:contain;display:block;
  transform-origin:var(--kbo,50% 50%);}
.sc.on .frame img,.sc.on .frame video{animation:kb var(--kbd,8s) linear both;}
@keyframes kb{from{transform:scale(1.005);}to{transform:scale(1.075);}}

/* ---------- 챕터 카드 ---------- */
.chapter .txt{position:absolute;left:700px;top:300px;width:1090px;}
.chapter .eye{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.5);}
.chapter .eye b{font-weight:600;}
.chapter h2{margin:20px 0 0;font-size:78px;line-height:1.1;font-weight:500;letter-spacing:-.02em;}
.chapter h2 em{font-style:normal;background:var(--gradient-primary-1);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.chapter p{margin:28px 0 0;font-size:25px;line-height:1.62;color:rgba(255,255,255,.66);max-width:960px;}
.chapter .rule{width:96px;height:2px;margin:34px 0 0;background:var(--gradient-primary-1);}

/* ---------- 오프닝 / 타이틀 ---------- */
.center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;}
.center img.logo{height:56px;width:auto;margin-bottom:34px;}
.center h1{margin:0;font-size:92px;line-height:1.08;font-weight:500;letter-spacing:-.025em;}
.center h1 em{font-style:normal;background:var(--gradient-primary-1);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.center p{margin:30px 0 0;font-size:26px;line-height:1.6;color:rgba(255,255,255,.62);max-width:1000px;}
.center .kicker{font-size:15px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.42);margin-bottom:26px;}

/* 스택 빌드 씬의 텍스트 (스택은 중앙, 텍스트는 위/아래) */
.build .top{position:absolute;left:200px;right:200px;top:118px;text-align:center;}
.build .top h2{margin:0;font-size:58px;font-weight:500;letter-spacing:-.02em;}
.build .top p{margin:18px 0 0;font-size:22px;color:rgba(255,255,255,.55);}
.build .legend{position:absolute;right:110px;top:300px;width:430px;}
.build .lg{display:flex;gap:14px;align-items:flex-start;padding:16px 0;
  border-top:1px solid rgba(255,255,255,.08);opacity:0;transform:translateX(18px);
  animation:lgIn .8s ease forwards;}
@keyframes lgIn{to{opacity:1;transform:translateX(0);}}
.build .lg s{width:10px;height:10px;border-radius:3px;margin-top:7px;flex:0 0 10px;}
.build .lg b{display:block;font-size:19px;font-weight:500;}
.build .lg span{display:block;margin-top:5px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.5);}

/* ---------- 로고 그리드 ---------- */
.grid-wrap{position:absolute;left:300px;right:150px;top:250px;}
.grid-wrap h3{margin:0 0 12px;font-size:44px;font-weight:500;letter-spacing:-.01em;}
.grid-wrap p{margin:0 0 40px;font-size:21px;color:rgba(255,255,255,.58);}
.lg-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;}
.lg-grid div{background:#fff;border-radius:10px;height:86px;display:flex;align-items:center;
  justify-content:center;padding:12px;opacity:0;animation:lgIn .7s ease forwards;}
.lg-grid img{max-width:100%;max-height:100%;object-fit:contain;}

/* ---------- 아웃트로 라인업 ---------- */
.lineup{position:relative;overflow:hidden;max-width:1060px;margin-top:38px;
  border-top:1px solid rgba(255,255,255,.10);}
.lu-row{display:grid;grid-template-columns:250px 1fr;align-items:center;gap:22px;
  padding:17px 0;border-bottom:1px solid rgba(255,255,255,.08);
  opacity:0;animation:lgIn .7s ease forwards;}
.lu-layer{display:flex;align-items:center;gap:13px;}
.lu-layer s{width:11px;height:11px;border-radius:3px;flex:0 0 11px;}
.lu-layer b{display:block;font-size:20px;font-weight:600;letter-spacing:.01em;}
.lu-layer span{display:block;margin-top:3px;font-size:13.5px;color:rgba(255,255,255,.48);}
.lu-tiles{display:flex;gap:14px;flex-wrap:wrap;}
.lu-tile{min-width:250px;padding:13px 18px 14px;border-radius:12px;
  border:1px solid rgba(255,255,255,.14);border-left:3px solid;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  opacity:0;transform:translateY(16px) scale(.94);
  animation:luPop .6s cubic-bezier(.2,.85,.3,1.15) forwards;}
.lu-tile b{display:block;font-size:19px;font-weight:600;}
.lu-tile span{display:block;margin-top:4px;font-size:13px;color:rgba(255,255,255,.55);}
@keyframes luPop{
  60%{opacity:1;transform:translateY(-3px) scale(1.02);
      box-shadow:0 8px 30px rgba(255,255,255,.10);}
  100%{opacity:1;transform:translateY(0) scale(1);box-shadow:none;}}
/* 라인업 완성 후 빛 스윕 */
.lineup::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 32%,rgba(255,255,255,.13) 50%,transparent 68%);
  transform:translateX(-130%);animation:luSweep 1.5s ease 6.6s forwards;}
@keyframes luSweep{to{transform:translateX(130%);}}

/* ---------- 아웃트로 ---------- */
.outro .txt{position:absolute;left:660px;top:150px;width:1160px;}
.outro h2{margin:0 0 6px;font-size:56px;font-weight:500;letter-spacing:-.02em;}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:1000px;}
.chip{padding:17px 20px;border:1px solid rgba(255,255,255,.16);border-radius:14px;
  background:rgba(255,255,255,.03);opacity:0;animation:lgIn .7s ease forwards;}
.chip s{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:9px;vertical-align:1px;}
.chip b{font-size:19px;font-weight:500;}
.chip span{display:block;margin-top:7px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.58);}
.outro .cta{position:absolute;left:660px;bottom:104px;display:flex;align-items:center;gap:26px;}

/* ============================================================

   ============================================================ */
var VSTACK = (function () {
  var host = document.getElementById('vision-stack');
  var svg = host.querySelector('.ls-stack');
  var wrap = document.getElementById('stackwrap');
  var NS = 'http://www.w3.org/2000/svg';
  var ORDER = [4, 3, 2, 1];               // 아래(데이터) → 위(오케스트레이션)
  var layers = ORDER.map(function (n) { return svg.querySelector('.ls-layer[data-ls-layer="' + n + '"]'); });
  var nodes = [].slice.call(svg.querySelectorAll('.ls-node'));

  var POSTS = [
    [128, 236, 118, 1100], [415, 150, 415, 1122], [712, 116, 722, 1012],
    [212, 300, 206, 1112], [610, 120, 616, 1050]
  ];
  var AMBER = '#d2a750', BLUE = '#6f9bc0', GREEN = '#4d8b76';
  var SEGMENTS = [
    [0, 1100, 878, 2, AMBER], [0, 878, 612, 3, BLUE], [0, 612, 352, 4, GREEN],
    [1, 1104, 722, 3, BLUE], [1, 722, 340, 4, GREEN],
    [2, 1012, 862, 2, AMBER], [2, 862, 600, 3, BLUE], [2, 600, 352, 4, GREEN],
    [3, 1108, 813, 2, AMBER], [3, 813, 518, 3, BLUE], [3, 518, 305, 4, GREEN],
    [4, 944, 645, 3, BLUE], [4, 645, 346, 4, GREEN]
  ];
  function xAt(p, y) { return p[0] + (y - p[1]) * (p[2] - p[0]) / (p[3] - p[1]); }

  var flows = [];
  var canFlow = window.CSS && CSS.supports && CSS.supports('offset-path', "path('M0,0 L1,1')");
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (canFlow && !reduced) {
    var tokenHost = svg.querySelector('.ls-tokens');
    SEGMENTS.forEach(function (s) {
      var p = POSTS[s[0]];
      var x1 = xAt(p, s[1]), y1 = s[1], x2 = xAt(p, s[2]), y2 = s[2];
      var dur = Math.max(1.9, Math.min(3.6, Math.abs(y1 - y2) / 110));
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'ls-flow');
      g.setAttribute('data-ls-stage', s[3]);
      for (var i = 0; i < 3; i++) {
        var t = document.createElementNS(NS, 'g');
        t.setAttribute('class', 'ls-token');
        t.style.offsetPath = "path('M " + x1.toFixed(1) + " " + y1 + " L " + x2.toFixed(1) + " " + y2 + "')";
        t.style.animationDuration = dur.toFixed(2) + 's';
        t.style.animationDelay = (-dur * i / 3).toFixed(2) + 's';
        t.innerHTML =
          '<circle r="15" fill="' + s[4] + '" opacity="0.20"></circle>' +
          '<circle r="6.4" fill="' + s[4] + '"></circle>' +
          '<circle r="2.6" fill="#ffffff" opacity="0.88"></circle>';
        g.appendChild(t);
      }
      tokenHost.appendChild(g);
      flows.push(g);
    });
  }

  function setStage(s) {
    layers.forEach(function (el, i) { if (el) el.classList.toggle('is-in', s >= i + 1); });
    nodes.forEach(function (el) {
      el.classList.toggle('is-in', s >= 5 - parseInt(el.getAttribute('data-ls-layer'), 10));
    });
    flows.forEach(function (el) {
      el.classList.toggle('is-in', s >= parseInt(el.getAttribute('data-ls-stage'), 10));
    });
    svg.style.setProperty('--ls-draw', (s / ORDER.length - 1).toFixed(3) + 'px');
  }

  host.classList.add('ls-armed');
  setStage(0);

  var timers = [];
  function clear() { timers.forEach(clearTimeout); timers = []; }

  return {
    /* 아래에서 위로 한 층씩 쌓는다. step 은 층 사이 간격(ms) */
    build: function (step) {
      step = step || 3200;
      clear(); setStage(0);
      for (var s = 1; s <= ORDER.length; s++) {
        (function (stage) {
          timers.push(setTimeout(function () { setStage(stage); }, 600 + (stage - 1) * step));
        })(s);
      }
    },
    full: function () { clear(); setStage(ORDER.length); },
    /* 지금 다루는 층만 밝힌다. n 이 없으면 전체 복원 */
    focus: function (n) {
      if (n) { wrap.setAttribute('data-focus', String(n)); }
      else { wrap.removeAttribute('data-focus'); }
    },
    mode: function (m) {
      wrap.className = 'stackwrap m-' + m;
      if (wrap.getAttribute('data-focus')) { /* focus 유지 */ }
    }
  };
})();

/* ============================================================
   상영 엔진
   ============================================================ */
(function () {
  var qs = new URLSearchParams(location.search);
  var EMBED = qs.get('embed') === '1';   /* 메인 페이지 미니 플레이어용: HUD 숨김 + 축약본 */
  if (EMBED) { document.documentElement.classList.add('embed'); }
  var SHORT = qs.get('mode') === 'short' || EMBED;
  var list = SHORT ? SCENES.filter(function (s) { return s.short; }) : SCENES.slice();

  var stage = document.getElementById('stage');
  var host = document.getElementById('sceneHost');
  var rail = document.getElementById('rail');
  var railItems = [].slice.call(rail.querySelectorAll('.rail-item'));
  var barFill = document.getElementById('barFill');
  var bar = document.getElementById('bar');
  var hudChapter = document.getElementById('hudChapter');
  var metaRight = document.getElementById('metaRight');
  var hint = document.getElementById('hint');
  var wrap = document.getElementById('stackwrap');

  var total = list.reduce(function (a, s) { return a + s.dur; }, 0);
  var offsets = []; (function () { var a = 0; list.forEach(function (s) { offsets.push(a); a += s.dur; }); })();

  /* 챕터 눈금 */
  (function () {
    var prev = null;
    list.forEach(function (s, i) {
      if (s.act === prev) return;
      prev = s.act;
      var u = document.createElement('u');
      u.style.left = (offsets[i] / total * 100).toFixed(3) + '%';
      bar.appendChild(u);
    });
  })();

  /* ---------- 스테이지 스케일 ---------- */
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.margin = ((innerHeight - 1080 * s) / 2) + 'px ' + ((innerWidth - 1920 * s) / 2) + 'px';
  }
  addEventListener('resize', fit); fit();

  /* ---------- 씬 렌더러 ---------- */
  function esc(v) { return v == null ? '' : String(v); }

  function kenBurns(i) {
    var o = [['30% 40%', '9s'], ['70% 45%', '10s'], ['50% 25%', '9s'], ['45% 70%', '10s']][i % 4];
    return 'style="--kbo:' + o[0] + ';--kbd:' + o[1] + '"';
  }

  function frameHTML(inner) {
    return '<div class="frame"><div class="bar-mac"><s></s><s></s><s></s></div>' +
           '<div class="pane">' + inner + '</div></div>';
  }

  function build(sc, i) {
    var el = document.createElement('div');
    el.className = 'sc ' + (sc.t === 'video' ? 'shot' : sc.t);

    if (sc.t === 'logo') {
      el.innerHTML =
        '<div class="center sc-in">' +
        '<img class="logo" src="../images/logo-w.png" alt="uEngine">' +
        '<div class="kicker">' + esc(sc.kicker) + '</div>' +
        '<h1>' + esc(sc.h1) + '</h1>' +
        '<p>' + esc(sc.p) + '</p></div>';

    } else if (sc.t === 'build') {
      var lgN = (sc.legend || []).length;
      var lg = (sc.legend || []).map(function (l, k) {
        return '<div class="lg" style="animation-delay:' + (1.2 + (lgN - 1 - k) * 3.2) + 's">' +
          '<s style="background:' + l[0] + '"></s><span><b>' + l[1] + '</b>' +
          '<span>' + l[2] + '</span></span></div>';
      }).join('');
      el.innerHTML =
        '<div class="top sc-in"><h2>' + esc(sc.h2) + '</h2><p>' + esc(sc.p) + '</p></div>' +
        '<div class="legend">' + lg + '</div>';

    } else if (sc.t === 'chapter') {
      el.innerHTML =
        '<div class="txt sc-in"><div class="eye">' + esc(sc.eye) + '</div>' +
        '<h2>' + esc(sc.h2) + '</h2><div class="rule"></div>' +
        '<p>' + esc(sc.p) + '</p></div>';

    } else if (sc.t === 'shot' || sc.t === 'video') {
      var media = sc.t === 'video'
        ? '<video ' + kenBurns(i) + ' muted playsinline loop autoplay preload="auto"' +
          (sc.poster ? ' poster="' + sc.poster + '"' : '') + ' src="' + sc.src + '"></video>'
        : '<img ' + kenBurns(i) + ' src="' + sc.src + '" alt="' + esc(sc.h3).replace(/<[^>]+>/g, ' ') + '">';
      el.innerHTML =
        '<div class="txt sc-in">' +
        '<span class="badge" data-layer="' + (sc.layer || 2) + '"><i></i>' +
        (sc.cat ? '<em>' + esc(sc.cat) + '</em>' : '') + esc(sc.product) + '</span>' +
        '<div class="step">' + esc(sc.step) + '</div>' +
        '<h3>' + esc(sc.h3) + '</h3><p>' + esc(sc.p) + '</p></div>' +
        '<div class="live">실제 제품 화면</div>' +
        frameHTML(media);

    } else if (sc.t === 'grid') {
      var cells = '';
      for (var n = 2; n <= 29; n++) {
        var id = (n < 10 ? '0' : '') + n;
        cells += '<div style="animation-delay:' + (0.5 + (n - 2) * 0.09).toFixed(2) + 's">' +
          '<img src="../images/clients-logos/' + id + '.png" alt="고객사 로고" loading="eager"></div>';
      }
      el.innerHTML = '<div class="grid-wrap sc-in"><h3>' + esc(sc.h3) + '</h3><p>' + esc(sc.p) + '</p>' +
        '<div class="lg-grid">' + cells + '</div></div>';

    } else if (sc.t === 'outro') {
      // 계층별 제품 라인업이 위에서부터 채워진다
      var rows = (sc.rows || []).map(function (r, k) {
        var base = 0.9 + k * 1.15;
        var tiles = r[3].map(function (t, m) {
          return '<div class="lu-tile" style="animation-delay:' + (base + 0.35 + m * 0.45).toFixed(2) + 's;' +
            'border-left-color:' + r[0] + '">' +
            '<b>' + t[0] + '</b><span>' + t[1] + '</span></div>';
        }).join('');
        return '<div class="lu-row" style="animation-delay:' + base.toFixed(2) + 's">' +
          '<div class="lu-layer"><s style="background:' + r[0] + '"></s>' +
          '<div><b>' + r[1] + '</b><span>' + r[2] + '</span></div></div>' +
          '<div class="lu-tiles">' + tiles + '</div></div>';
      }).join('');
      el.innerHTML =
        '<div class="txt sc-in"><h2>' + esc(sc.h2) + '</h2>' +
        '<div class="lineup">' + rows + '</div></div>' +
        '<div class="cta sc-in"><div><div class="url">' + esc(sc.url) + '</div>' +
        '<div class="sub">' + esc(sc.sub) + '</div></div></div>';
    }
    return el;
  }

  /* ---------- 프리로드 ---------- */
  var preloaded = {};
  function preload(from) {
    for (var k = from; k < Math.min(from + 4, list.length); k++) {
      var s = list[k];
      if (!s.src || preloaded[s.src]) continue;
      preloaded[s.src] = 1;
      if (s.t === 'shot') { var im = new Image(); im.src = s.src; }
    }
  }

  /* ---------- 재생 ---------- */
  var idx = -1, elapsedMs = 0, last = 0, paused = false, current = null;

  function stackMode(sc) {
    var m = sc.stack || (sc.t === 'logo' ? 'off' : 'rail');
    wrap.className = 'stackwrap m-' + m;
    VSTACK.focus(sc.layer || 0);
    rail.style.opacity = (m === 'rail') ? '1' : '0';
    railItems.forEach(function (it) {
      var on = String(sc.layer || '') === it.getAttribute('data-layer');
      it.classList.toggle('on', on);
      it.querySelector('.rail-dot').classList.toggle('on', on);
    });
  }

  function show(i) {
    i = (i + list.length) % list.length;
    idx = i; elapsedMs = 0;
    var sc = list[i];
    current = sc;

    var el = build(sc, i);
    host.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('on'); });

    // 이전 씬 정리
    [].slice.call(host.children).forEach(function (c) {
      if (c === el) return;
      c.classList.remove('on');
      setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 800);
    });

    if (sc.t === 'build') { VSTACK.build(3400); }
    else if (i === 0) { VSTACK.full(); }
    else { VSTACK.full(); }

    if (paused) {
      [].slice.call(el.querySelectorAll('video')).forEach(function (v) { v.pause(); });
    }
    stackMode(sc);
    hudChapter.textContent = (ACTS[sc.act] || {}).label || '';
    document.querySelector('.hud-top').style.opacity = (sc.t === 'logo') ? '0' : '1';
    metaRight.textContent = (i + 1) + ' / ' + list.length + (SHORT ? '  ·  SHORT CUT' : '');
    preload(i + 1);
  }

  function next() { show(idx + 1); }
  function prev() { show(idx - 1); }
  function jumpAct(dir) {
    var act = list[idx].act, i = idx;
    if (dir > 0) { while (i < list.length && list[i].act === act) i++; if (i >= list.length) i = 0; }
    else {
      while (i > 0 && list[i].act === act) i--;
      var a2 = list[i].act; while (i > 0 && list[i - 1].act === a2) i--;
    }
    show(i);
  }

  function tick(ts) {
    if (!last) last = ts;
    var dt = ts - last; last = ts;
    if (!paused && current) {
      elapsedMs += dt;
      var p = (offsets[idx] + Math.min(elapsedMs / 1000, current.dur)) / total;
      barFill.style.width = (p * 100).toFixed(3) + '%';
      if (elapsedMs >= current.dur * 1000) next();
    }
    requestAnimationFrame(tick);
  }

  /* ---------- 조작 ---------- */
  function setPaused(v) {
    paused = v;
    [].slice.call(host.querySelectorAll('video')).forEach(function (v2) {
      if (paused) { v2.pause(); } else { var pr = v2.play(); if (pr && pr.catch) pr.catch(function () {}); }
    });
    hint.style.opacity = paused ? '1' : '';
  }

  addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (e.key === ' ') { e.preventDefault(); setPaused(!paused); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); jumpAct(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); jumpAct(-1); }
    else if (k === 'f') {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { document.documentElement.requestFullscreen(); }
    }
    else if (k === 's') {
      location.search = SHORT ? '' : '?mode=short';
    }
  });

  /* 마우스를 멈추면 힌트를 숨긴다 (전시 상영용) */
  var hideT = null;
  function poke() {
    hint.style.opacity = '1';
    clearTimeout(hideT);
    hideT = setTimeout(function () { if (!paused) hint.style.opacity = '0'; }, 4000);
  }
  addEventListener('mousemove', poke); poke();

  /* 클릭/탭으로도 다음 장면 */
  stage.addEventListener('click', function (e) {
    if (e.clientX < innerWidth * 0.18) { prev(); } else { next(); }
  });

  document.getElementById('metaLeft').textContent =
    'uengine.org  ·  ' + Math.floor(total / 60) + '분 ' + (total % 60) + '초 자동 반복 상영' +
    (SHORT ? '  ·  축약본' : '');

  show(0);
  requestAnimationFrame(tick);
})();

</script>
